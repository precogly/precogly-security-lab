# Grype: known vulnerabilities in Precogly's frontend image, as built at the run's commit.
# A second image scanner beside Trivy, so their findings can be compared per tool.
name        = "grype-frontend"
image       = "anchore/grype:v0.120.1"
inputs      = ["precogly-images"]
scans_image = "precogly-frontend"
# The image's entrypoint is grype.
command     = ["docker-archive:/in/precogly-images/frontend.tar", "-o", "cyclonedx-json=/out/report.cdx.json"]
report      = "report.cdx.json"
timeout     = "30m"
